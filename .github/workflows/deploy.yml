name: Deploy Database EC2

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  PROJECT_NAME: nitra-database

jobs:
  deploy-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=nitra-database/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="tf_state_bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -var="db_name=${{ secrets.DB_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="lambda_security_group_id=${{ secrets.LAMBDA_SECURITY_GROUP_ID }}" \
            -var="database_public_access=true" \
            -var='database_public_cidrs=["0.0.0.0/0"]'

      - name: Compactar arquivos do banco
        run: |
          zip -r database-${{ github.sha }}.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "infra/*"

      - name: Enviar pacote para S3
        run: |
          aws s3 cp database-${{ github.sha }}.zip \
            s3://${{ secrets.TF_STATE_BUCKET }}/deployments/database-${{ github.sha }}.zip

      - name: Buscar instance id
        id: tfout
        working-directory: infra
        run: |
          INSTANCE_ID=$(terraform output -raw database_instance_id)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Aguardar EC2 ficar online no SSM
        run: |
          INSTANCE_ID="${{ steps.tfout.outputs.instance_id }}"

          echo "Aguardando instância $INSTANCE_ID ficar online no SSM..."

          for i in {1..30}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)

            echo "Tentativa $i - Status: $STATUS"

            if [ "$STATUS" = "Online" ]; then
              echo "Instância online no SSM."
              exit 0
            fi

            sleep 20
          done

          echo "Instância não ficou online no SSM a tempo."
          exit 1

      - name: Rodar banco e Flyway na EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.tfout.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy database migrations" \
            --parameters 'commands=[
              "set -e",

              "aws s3 cp s3://${{ secrets.TF_STATE_BUCKET }}/deployments/database-${{ github.sha }}.zip /tmp/database.zip",

              "rm -rf /opt/nitra/database",

              "mkdir -p /opt/nitra/database",

              "unzip -q /tmp/database.zip -d /opt/nitra/database",

              "cd /opt/nitra/database",

              "docker network create nitra-network || true",

              "docker rm -f nitra-postgres || true",

              "docker run -d \
                --name nitra-postgres \
                --network nitra-network \
                -p 5432:5432 \
                -e POSTGRES_DB=${{ secrets.DB_NAME }} \
                -e POSTGRES_USER=${{ secrets.DB_USER }} \
                -e POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }} \
                postgres:16",

              "for i in {1..30}; do \
                docker exec nitra-postgres \
                pg_isready \
                -U ${{ secrets.DB_USER }} \
                -d ${{ secrets.DB_NAME }} \
                && break || sleep 5; \
              done",

              "docker build -t nitra-flyway .",

              "docker run --rm \
                --network nitra-network \
                -e DB_HOST=nitra-postgres \
                -e DB_NAME=${{ secrets.DB_NAME }} \
                -e DB_USER=${{ secrets.DB_USER }} \
                -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                nitra-flyway"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.tfout.outputs.instance_id }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.tfout.outputs.instance_id }}"