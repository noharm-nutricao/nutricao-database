name: Deploy Database EC2

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  PROJECT_NAME: nitra-database

jobs:
  deploy-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=nitra-database/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="tf_state_bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -var="db_name=${{ secrets.DB_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="lambda_security_group_id=${{ secrets.LAMBDA_SECURITY_GROUP_ID }}"

      - name: Buscar dados da EC2
        id: ec2
        working-directory: infra
        run: |
          INSTANCE_ID=$(terraform output -raw database_instance_id)

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Aguardar SSH ficar disponível
        run: |
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ec2-user@${{ steps.ec2.outputs.public_ip }} "echo ok"; then
              echo "SSH disponível."
              exit 0
            fi

            echo "Tentativa $i - SSH ainda indisponível."
            sleep 20
          done

          echo "SSH não ficou disponível a tempo."
          exit 1

      - name: Compactar arquivos do banco
        run: |
          zip -r database-${{ github.sha }}.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "infra/*"

      - name: Enviar pacote para EC2
        run: |
          scp -o StrictHostKeyChecking=no \
            database-${{ github.sha }}.zip \
            ec2-user@${{ steps.ec2.outputs.public_ip }}:/tmp/database.zip

      - name: Rodar banco e Flyway via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ steps.ec2.outputs.public_ip }} << 'EOF'
            set -e

            if ! sudo cloud-init status --wait; then
              echo "cloud-init terminou com erro; seguindo com o deploy via SSH para nao bloquear o banco existente."
              sudo tail -n 200 /var/log/cloud-init-output.log || true
            fi

            sudo dnf install -y unzip docker
            sudo dnf clean all
            sudo rm -rf /var/cache/dnf

            sudo systemctl enable docker
            sudo systemctl start docker

            until sudo docker info >/dev/null 2>&1; do
              sleep 2
            done

            echo "Espaco em disco antes do deploy:"
            df -h

            sudo rm -rf /opt/nitra/database
            sudo mkdir -p /opt/nitra/database
            sudo mkdir -p /opt/nitra/postgres-data

            sudo unzip -q /tmp/database.zip -d /opt/nitra/database
            sudo rm -f /tmp/database.zip

            cd /opt/nitra/database

            if sudo docker ps -a --format '{{.Names}}' | grep -Fxq nitra-postgres; then
              sudo docker start nitra-postgres >/dev/null || true
            else
              sudo docker run -d \
                --name nitra-postgres \
                -p 5432:5432 \
                -e POSTGRES_DB='${{ secrets.DB_NAME }}' \
                -e POSTGRES_USER='${{ secrets.DB_USER }}' \
                -e POSTGRES_PASSWORD='${{ secrets.DB_PASSWORD }}' \
                -v /opt/nitra/postgres-data:/var/lib/postgresql/data \
                postgres:16
            fi

            for i in {1..30}; do
              sudo docker exec nitra-postgres pg_isready \
                -U '${{ secrets.DB_USER }}' \
                -d '${{ secrets.DB_NAME }}' && break || sleep 5
            done

            sudo docker run --rm \
              --network host \
              -v /opt/nitra/database/migrations/flyway:/flyway/sql:ro \
              -v /opt/nitra/database/flyway/flyway.conf:/flyway/conf/flyway.conf:ro \
              flyway/flyway:10 \
              -url=jdbc:postgresql://localhost:5432/${{ secrets.DB_NAME }} \
              -user=${{ secrets.DB_USER }} \
              -password=${{ secrets.DB_PASSWORD }} \
              migrate
          EOF
